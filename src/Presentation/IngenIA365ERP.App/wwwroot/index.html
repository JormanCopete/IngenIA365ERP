<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>IngenIA365ERP</title>
    <base href="/" />
    <!-- Preferencias antes de pintar: evita el destello blanco al abrir la app
         con tema oscuro. Mismo criterio que en el host web (App.razor). -->
    <script>
        (function () {
            try {
                var p = JSON.parse(localStorage.getItem('erp-preferencias') || '{}');
                var r = document.documentElement;
                r.setAttribute('data-tema', p.tema || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'));
                if (p.densidad)  r.setAttribute('data-densidad', p.densidad);
                if (p.escala)    r.setAttribute('data-escala', p.escala);
                if (p.contraste) r.setAttribute('data-contraste', p.contraste);
            } catch (e) {
                document.documentElement.setAttribute('data-tema', 'claro');
            }
        })();
    </script>

    <!-- La app de escritorio y móvil comparte las pantallas con la web, así que
         comparte también el sistema de diseño. Inter la declara tokens.css con
         @font-face y la sirve el propio paquete desde
         _content/IngenIA365ERP.Shared/fonts/, así que funciona sin conexión.
         Hasta el 2026-09-12 este comentario lo prometía pero no había ningún
         archivo de fuente en el paquete: la app caía a Segoe UI sin avisar. -->
    <link id="sf-tema-claro" href="_content/Syncfusion.Blazor.Themes/fluent2.css" rel="stylesheet" />
    <link id="sf-tema-oscuro" href="_content/Syncfusion.Blazor.Themes/fluent2-dark.css" rel="stylesheet" disabled />
    <script>
        (function () {
            var oscuro = document.documentElement.getAttribute('data-tema') === 'oscuro';
            document.getElementById('sf-tema-claro').disabled = oscuro;
            document.getElementById('sf-tema-oscuro').disabled = !oscuro;
        })();
    </script>

    <link rel="stylesheet" href="_content/IngenIA365ERP.Shared/css/tokens.css" />
    <link rel="stylesheet" href="_content/IngenIA365ERP.Shared/css/app.css" />
    <link rel="stylesheet" href="_content/IngenIA365ERP.Shared/css/componentes.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="IngenIA365ERP.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script src="_content/IngenIA365ERP.Shared/js/preferencias.js"></script>
</body>

</html>
