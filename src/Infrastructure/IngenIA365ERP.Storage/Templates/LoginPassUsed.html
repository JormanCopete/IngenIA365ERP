<!DOCTYPE html>

<!-- Feature 027: aviso al usuario en cada ingreso con el pase. -->
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2937; max-width: 600px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 22px;">Entraste con un pase temporal</h1>

  <p>
    Se entró a tu cuenta en <strong>{{Cooperativa}}</strong> con un pase de ingreso sin segundo factor el <strong>{{Cuando}}</strong>
    (hora de Colombia), desde la dirección <strong>{{Ip}}</strong> ({{Equipo}}).
  </p>

  <p style="background-color: #fef2f2; border-left: 4px solid #b91c1c; padding: 12px 16px;">
    <strong>Si no fuiste tú</strong>, cambia tu contraseña de inmediato y avisa a tu administrador para que anule el pase.
  </p>
</body>
</html>
