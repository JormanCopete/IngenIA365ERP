version: "3.9"

# Stack de infraestructura local para desarrollo de la Fase 0 (cimientos técnicos).
# Solo levanta los servicios de datos/correo: la API y el Web se ejecutan con
# `dotnet run` desde el IDE para iterar más rápido.
#
# Levantar:   docker compose -f docker/dev.yml up -d
# Detener:    docker compose -f docker/dev.yml down
# Limpiar:    docker compose -f docker/dev.yml down -v   # ¡borra los volúmenes!

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ingenia365-dev-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "IngenIA365_Dev2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-dev-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "IngenIA365_Dev2026!" -Q "SELECT 1" -C -No
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: ingenia365-dev-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-dev-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: IngenIA365ERP_Audit

  redis:
    image: redis:7-alpine
    container_name: ingenia365-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: ingenia365-dev-smtp4dev
    ports:
      - "5025:25"     # SMTP
      - "5080:80"     # UI web
    volumes:
      - smtp4dev-dev-data:/smtp4dev

volumes:
  sqlserver-dev-data:
  mongodb-dev-data:
  redis-dev-data:
  smtp4dev-dev-data:
