# =============================================================================
# docker-compose.dev.yml
#
# Alternativa Docker para desarrollo local del feature 002 (Identidad Central).
# Levanta SOLO los servicios auxiliares que el setup local (SQL Server nativo
# Windows + MongoDB nativo Windows) no cubre:
#
#   - redis     → mismo puerto (6379) que la instalación WSL local
#   - smtp4dev  → mismo puerto SMTP (1025) y UI (8025) que `dotnet tool smtp4dev`
#   - postgres  → motor por defecto de desarrollo desde el feature 004
#                 (multi-motor). SQL Server sigue siendo el servicio nativo
#                 Windows (puerto 1433) para probar la variante on-premise.
#
# El objetivo es que el `appsettings.Development.json` funcione idéntico tanto
# si usás el stack local como si usás este compose — no hay que cambiar
# connection strings al alternar.
#
# Levantar:
#   docker compose -f docker-compose.dev.yml up -d
#
# Detener:
#   docker compose -f docker-compose.dev.yml down
#
# Detener y borrar volúmenes:
#   docker compose -f docker-compose.dev.yml down -v
#
# NOTA: SI ya tenés Redis en WSL o smtp4dev nativo escuchando en esos puertos,
# apagálos antes de levantar este compose — o Docker fallará con "port in use".
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: ingenia365-dev-redis
    # --databases: Redis trae 16 bases logicas por defecto y el parametro es
    # INMUTABLE en caliente (CONFIG SET lo rechaza), asi que hay que fijarlo al
    # arrancar el servidor. Con una base por cooperativa y la 0 reservada para lo
    # global, 16 significaria un techo de 15 cooperativas.
    #
    # Produccion tiene que declarar el mismo valor o mayor: si la aplicacion pide
    # una base que el servidor no tiene, Redis responde error y la cooperativa
    # afectada se queda sin cache.
    #
    # Limitacion registrada: Redis Cluster soporta UNICAMENTE la base 0. Este
    # diseno es incompatible con clustering.
    command: ["redis-server", "--databases", "64", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    container_name: ingenia365-dev-postgres
    ports:
      # 5433 en el host: la maquina dev tiene un PostgreSQL nativo ocupando 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: ingenia
      POSTGRES_PASSWORD: IngenIA365_Dev2026!
      POSTGRES_DB: ingenia365erp
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingenia -d ingenia365erp"]
      interval: 10s
      timeout: 3s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: ingenia365-dev-smtp4dev
    ports:
      - "1025:25"      # SMTP — igual que el nativo dotnet-tool
      - "8025:80"      # Web UI — igual que el nativo dotnet-tool
    volumes:
      - smtp4dev-dev-data:/smtp4dev
    restart: unless-stopped

volumes:
  redis-dev-data:
  postgres-dev-data:
  smtp4dev-dev-data:
