name: CI/CD Pipeline

on:
  # Flujo de ramas:
  #   develop -> integracion (publica :develop y escribe su digest en los overlays dev y qa)
  #   release -> PRODUCCION  (publica :release y escribe su digest en el overlay pdn)
  # El despliegue va por DIGEST en el repo GitOps (job gitops, al final); las
  # etiquetas quedan solo para que un humano las lea.
  push:
    branches: [main, develop, release]
    # Un commit que solo toca documentacion no cambia ninguna imagen: no vale
    # 9 minutos de runner ni un relevo de pods en DEV y QA (cada corrida produce
    # digests nuevos aunque el binario sea el mismo). Ojo: con estos filtros un
    # push de solo docs NO escribe digests en el GitOps, y es lo correcto.
    paths-ignore: ['docs/**', 'specs/**', '**/*.md']
  # Los PRs a estas ramas tambien deben pasar el CI. Sin esto, el codigo
  # llegaba a develop sin ejecutar una sola prueba.
  pull_request:
    branches: [main, develop, release]
    paths-ignore: ['docs/**', 'specs/**', '**/*.md']
  # Permite validar imagenes desde cualquier rama sin esperar a un merge.
  workflow_dispatch:
    inputs:
      push_images:
        description: "Publicar las imagenes en GHCR"
        type: boolean
        default: false

# Forma del pipeline (desde el 2026-09-13):
#
#   build-and-test ──┐
#   publish-api ─────┼──> docker (matriz api|web|migrator) ──> gitops
#   publish-web ─────┘
#
# Se compila UNA vez en el runner y las imagenes solo empaquetan el resultado.
# Antes cada Dockerfile arrastraba el SDK y recompilaba el grafo completo, tres
# veces y en serie, y ademas exportaba ~7 min de cache a GitHub Actions que nunca
# acertaba (un solo scope para tres imagenes, y el repo en el tope de 10 GB):
# 24 min de docker-build hasta para un commit que tocaba una linea de docs.
# Ver docs/operaciones/despliegue-infraestructura.md, seccion "Imagenes".
#
# El publish del Web va en su propio job porque el recorte y la compresion del
# cliente WebAssembly son el paso mas largo de todo el pipeline y no tienen por
# que esperar a las pruebas ni retrasarlas.

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # OJO: los nombres de repositorio de un registro Docker DEBEN ir en minusculas,
  # y github.repository conserva las mayusculas del nombre real
  # (JormanCopete/IngenIA365ERP). Se normalizan en el paso "Calcular etiquetas".

# Una corrida viva por PR o por rama: un push nuevo cancela la corrida anterior de
# la misma rama, que ya no se va a desplegar (en develop, la corrida nueva lleva los
# dos cambios y escribe el digest de ambos). El 2026-11-11 tres merges seguidos a
# develop corrieron tres pipelines completos a la vez. release NO entra: cada
# corrida lleva un grupo propio, nunca espera ni se cancela, porque lo que aprueba
# Argo en produccion es el commit que escribe su job gitops.
concurrency:
  group: ${{ github.ref == 'refs/heads/release' && format('ci-release-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Una corrida sana tarda ~20 min (mediana del 05 al 12/11). El reloj corta un
    # runner que se quedo sin memoria en vez de dejarlo colgado horas.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # global.json fija la banda 10.0.3xx (la 10.0.4xx publica el Web SIN
      # blazor.web.js, ver la nota en global.json). Con "10.0.x" el runner instalaba
      # la 10.0.401 y compilaba con la que trajera preinstalada la imagen.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Los dos proyectos de migraciones EF pesan ~190 MB de C# cada uno (102
      # migraciones; cada *.Designer.cs es una foto completa del modelo, 2-3 MB).
      # Compilados a la vez no caben en los 15 GiB del runner: del 05 al 12/11 el
      # job murio 10 veces en "Restore y Build" con «The runner has received a
      # shutdown signal». Aqui se compilan de a uno y sin servidores de compilacion
      # (--disable-build-servers: el proceso que compilo uno muere y devuelve su
      # memoria antes del siguiente). El build de abajo los encuentra al dia y no
      # los vuelve a compilar: en su log, las lineas "Migrations.* ->" salen en
      # segundos. Si algun dia no fuera asi, ese build los recompilaria en paralelo
      # y volveria el problema.
      - name: Compilar migraciones de a una
        run: |
          set -e
          dotnet build src/Infrastructure/IngenIA365ERP.Persistence.Migrations.PostgreSql/IngenIA365ERP.Persistence.Migrations.PostgreSql.csproj -c Release --disable-build-servers
          dotnet build src/Infrastructure/IngenIA365ERP.Persistence.Migrations.SqlServer/IngenIA365ERP.Persistence.Migrations.SqlServer.csproj -c Release --disable-build-servers

      # Una sola invocacion sobre el filtro de solucion (sin MAUI ni pruebas con
      # Docker): MSBuild resuelve el grafo una vez en lugar de siete.
      - name: Restore y Build
        run: dotnet build IngenIA365ERP.CI.slnf -c Release

      - name: Test Domain
        run: dotnet test tests/IngenIA365ERP.Domain.Tests -c Release --no-build --verbosity normal

      - name: Test Application
        run: dotnet test tests/IngenIA365ERP.Application.Tests -c Release --no-build --verbosity normal

      - name: Test Architecture
        run: dotnet test tests/IngenIA365ERP.Architecture.Tests -c Release --no-build --verbosity normal

      # Cliente sin navegador: la renovacion silenciosa de la sesion y su handler HTTP.
      - name: Test Shared
        run: dotnet test tests/IngenIA365ERP.Shared.Tests -c Release --no-build --verbosity normal

  # Lo que va dentro de las imagenes de API y migrador. ContainerPublish=true activa
  # en los csproj RuntimeIdentifier linux-x64 + ReadyToRun (codigo nativo
  # precompilado: el pod arranca y atiende la primera peticion sin pagar el JIT
  # entero). Es una compilacion distinta de la que corren las pruebas (otro RID) y
  # tarda ~4 min con crossgen; por eso va en su propio job, en paralelo con las
  # pruebas y con el publish del Web, y no alarga el reloj del pipeline.
  publish-api:
    runs-on: ubuntu-latest
    # Sano: 10-25 min. Del 05 al 12/11 llego a 3 h 20 min arrastrandose sobre el
    # swap; mejor que falle a los 45 y se vea.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Con la 015 el publish empezo a agotar la memoria del runner y GitHub lo apagaba
      # («The runner has received a shutdown signal»). Se culpo a ReadyToRun y se agrego
      # swap y crossgen2 de a dos ensamblados. Los logs con hora del 09, 10 y 12/11
      # muestran otra cosa: crossgen de la API tarda 5-6 min; lo que tardaba 2-3 h era
      # COMPILAR los dos proyectos de migraciones a la vez (ver el paso "Compilar
      # migraciones de a una" en build-and-test). El swap queda como colchon: sin el, el
      # runner muere; con el y compilando de a uno, no deberia tocarse.
      - name: Swap para ReadyToRun
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # -m:1: MSBuild construye un proyecto a la vez, asi los dos de migraciones nunca
      # compilan juntos. Cuesta unos minutos en los proyectos chicos; a cambio, el pico
      # de memoria es el de UN proyecto de migraciones y no el de dos.
      - name: Publish API y Migrator
        run: |
          set -e
          dotnet publish src/Presentation/IngenIA365ERP.API/IngenIA365ERP.API.csproj -c Release -m:1 -p:ContainerPublish=true -p:PublishReadyToRunCrossgen2ExtraArgs=--parallelism:2 -o artifacts/api
          dotnet publish tools/IngenIA365ERP.DbMigrator/IngenIA365ERP.DbMigrator.csproj -c Release -m:1 -p:ContainerPublish=true -o artifacts/migrator
          test -f artifacts/api/IngenIA365ERP.API.dll
          test -f artifacts/migrator/IngenIA365ERP.DbMigrator.dll

      - uses: actions/upload-artifact@v4
        with:
          name: publish-api
          path: artifacts/api
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: publish-migrator
          path: artifacts/migrator
          retention-days: 3
          if-no-files-found: error

  publish-web:
    runs-on: ubuntu-latest
    # Sano: ~6 min (maximo 6,6 del 05 al 12/11).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # SIN --no-restore, y no es un descuido: el script de arranque
      # _framework/blazor.web.js llega en el paquete
      # microsoft.aspnetcore.app.internal.assets, que el SDK resuelve durante el
      # restore DEL PUBLISH. Con --no-restore el publish sale sin el y sin una sola
      # advertencia: la app arranca, responde 200 y el navegador queda en blanco.
      #
      # Tampoco se instala el workload wasm-tools: sin el se usa el runtime
      # WebAssembly prearmado (el relinking nativo necesita Python y mucha RAM).
      - name: Publish Web
        run: dotnet publish src/Presentation/IngenIA365ERP.Web/IngenIA365ERP.Web.csproj -c Release -o artifacts/web

      # COMPROBACION QUE ROMPE EL PIPELINE A PROPOSITO. App.razor arranca con
      # @Assets["_framework/blazor.web.js"]; si el SDK no lo genera, la imagen se
      # construye, arranca, / responde HTTP 200 con el shell, la sonda la da por
      # sana... y el navegador muestra una pantalla en blanco. Paso en produccion.
      - name: Comprobar blazor.web.js
        run: |
          f=artifacts/web/IngenIA365ERP.Web.staticwebassets.endpoints.json
          test -f "$f" && grep -q 'blazor\.web\.js' "$f" || {
            echo "::error::el publish no incluye _framework/blazor.web.js; la aplicacion arrancaria en blanco. Revisar que el SDK cumpla global.json."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: publish-web
          path: artifacts/web
          retention-days: 3
          if-no-files-found: error

  docker:
    # Las tres publicaciones y las pruebas: una imagen no se construye si algo fallo.
    needs: [build-and-test, publish-api, publish-web]
    runs-on: ubuntu-latest
    # Siempre se CONSTRUYE (un Dockerfile roto debe detectarse en el PR, no
    # despues de mergear). Solo se PUBLICA desde main/develop/release.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/Presentation/IngenIA365ERP.API/Dockerfile
          - image: web
            dockerfile: src/Presentation/IngenIA365ERP.Web/Dockerfile
          - image: migrator
            dockerfile: tools/IngenIA365ERP.DbMigrator/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: publish-${{ matrix.image }}
          path: contexto

      # El despliegue es GitOps: Argo CD sincroniza por DIGEST inmutable, no por
      # "latest". Estas etiquetas son solo para trazabilidad humana.
      - name: Calcular etiquetas
        id: meta
        run: |
          # En un pull_request GITHUB_REF_NAME es "5/merge": no sirve como
          # etiqueta de imagen. Se usa el nombre de la rama de origen.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="pr-${GITHUB_REF_NAME%%/*}"
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
          fi
          SHORT="${GITHUB_SHA::12}"
          # Normalizacion a minusculas: requisito del registro.
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${REPO_LC}/${{ matrix.image }}"
          TAGS="${IMAGE}:${BRANCH},${IMAGE}:${BRANCH}-${SHORT}"
          # "latest" lo mueve la rama de PRODUCCION, no main: es la unica lectura
          # util de esa etiqueta ("lo que hay publicado para los clientes").
          # El despliegue real igual va por digest, no por esta etiqueta.
          if [ "$GITHUB_REF_NAME" = "release" ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          # Solo se publica desde main/develop/release; en un PR se construye para
          # validar, pero no se contamina el registro con imagenes sin mergear.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.push_images }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sin cache-from/cache-to: la imagen es la base aspnet mas una capa con el
      # publish; no hay nada que valga la pena cachear y la exportacion costaba
      # mas que la construccion entera.
      - name: Build and Push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: contexto
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      # Los outputs de un job con matriz se pisan entre si; el digest viaja como
      # artefacto con nombre propio y gitops los recoge todos.
      # Igual que credential-helper: sin publicar no hay digest, y solo lo usa gitops (push).
      - name: Guardar digest
        if: steps.meta.outputs.push == 'true'
        run: |
          mkdir -p digests
          case "${{ steps.build.outputs.digest }}" in
            sha256:*) echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}" ;;
            *) echo "::error::la imagen ${{ matrix.image }} no devolvio un digest valido: '${{ steps.build.outputs.digest }}'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.push == 'true'
        with:
          name: digest-${{ matrix.image }}
          path: digests
          retention-days: 3
          if-no-files-found: error

  # Feature 011 (US5, T070): el sidecar de credenciales temporales (IAM Roles
  # Anywhere). No sale del publish de .NET: su Dockerfile descarga el binario
  # oficial de AWS en la version fijada y verifica la SHA-256 que AWS publica; si
  # no coincide, el build falla. Mismas reglas que las demas imagenes: se construye
  # siempre y se publica solo en push. El job gitops fija su digest en los overlays
  # que declaran la imagen (T073).
  credential-helper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Calcular etiquetas
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="pr-${GITHUB_REF_NAME%%/*}"
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
          fi
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${REPO_LC}/credential-helper"
          VERSION=$(sed -n 's/^ARG VERSION=//p' tools/credential-helper/Dockerfile)
          echo "tags=${IMAGE}:${BRANCH},${IMAGE}:${VERSION}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.push_images }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push credential-helper
        id: build
        uses: docker/build-push-action@v5
        with:
          context: tools/credential-helper
          file: tools/credential-helper/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      # Sin publicar (pull_request) build-push-action no devuelve digest; solo hace falta para
      # el job gitops, que corre en push. Antes este paso dejaba rojo todo PR.
      - name: Guardar digest
        if: steps.meta.outputs.push == 'true'
        run: |
          mkdir -p digests
          case "${{ steps.build.outputs.digest }}" in
            sha256:*) echo "${{ steps.build.outputs.digest }}" > "digests/credential-helper" ;;
            *) echo "::error::el sidecar no devolvio un digest valido: '${{ steps.build.outputs.digest }}'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.push == 'true'
        with:
          name: digest-credential-helper
          path: digests
          retention-days: 3
          if-no-files-found: error

  # Escribe el DIGEST de las imagenes recien publicadas en el overlay del ambiente
  # que alimenta esta rama, en el repositorio GitOps (P3, cerrado el 2026-09-10).
  #
  # Por que digest y no etiqueta: :develop y :release son etiquetas MOVILES.
  # Republicarlas no cambia el manifiesto, Argo dice Synced y los pods siguen con
  # la imagen anterior hasta que alguien hace rollout restart a mano. Un digest es
  # inmutable: cambiarlo es un cambio real, Kubernetes rota solo, y el commit deja
  # escrito que artefacto corre en cada ambiente.
  #
  #   develop -> overlays dev y qa (Argo sincroniza solo)
  #   release -> overlay pdn       (Argo espera la aprobacion manual; lo que se
  #                                 aprueba es este commit)
  #
  # Necesita el secreto GITOPS_TOKEN: un token con permiso de contenido (lectura y
  # escritura) sobre JormanCopete/ingenia365-gitops. Sin el, este job FALLA a
  # proposito: un despliegue que no llego y nadie noto es peor que un CI rojo.
  gitops:
    needs: [docker, credential-helper]
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Un solo escritor a la vez sobre el repo GitOps: dos pushes seguidos no se
    # pisan el commit.
    concurrency:
      group: gitops-digests
      cancel-in-progress: false
    env:
      GITOPS_REPO: JormanCopete/ingenia365-gitops
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Comprobar credencial y digests
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::Falta el secreto GITOPS_TOKEN (token con permiso de contenido sobre $GITOPS_REPO). Las imagenes se publicaron, pero NINGUN ambiente las va a desplegar hasta que exista."
            exit 1
          fi
          for i in api web migrator; do
            d=$(cat "digests/$i" 2>/dev/null || true)
            case "$d" in sha256:*) echo "${i^^}_DIGEST=$d" >> "$GITHUB_ENV" ;; *) echo "::error::$i no trae un digest valido: '$d'"; exit 1;; esac
          done
          d=$(cat "digests/credential-helper" 2>/dev/null || true)
          case "$d" in sha256:*) echo "SIDECAR_DIGEST=$d" >> "$GITHUB_ENV" ;; *) echo "::error::credential-helper no trae un digest valido: '$d'"; exit 1;; esac

      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0

      - name: Fijar digests en los overlays
        id: fijar
        run: |
          set -e
          case "$GITHUB_REF_NAME" in
            develop) OVERLAYS="dev qa" ;;
            release) OVERLAYS="pdn" ;;
            *) echo "rama sin ambiente: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          REG=ghcr.io/jormancopete/ingenia365erp
          for o in $OVERLAYS; do
            f="gitops/workloads/erp/overlays/$o/kustomization.yaml"
            # Solo las imagenes que el overlay ya declara (dev y qa no llevan migrator).
            # Se escribe digest y se retira newTag: kustomize no admite los dos.
            # El sidecar de credenciales (feature 011) solo en los overlays que ya lo declaran.
            for par in "api=$API_DIGEST" "web=$WEB_DIGEST" "migrator=$MIGRATOR_DIGEST" "credential-helper=$SIDECAR_DIGEST"; do
              nombre="$REG/${par%%=*}"; digest="${par#*=}"
              N="$nombre" D="$digest" yq -i '(.images[] | select(.name == strenv(N))) |= (.digest = strenv(D) | del(.newTag))' "$f"
            done
            echo "::group::$f"; grep -A1 "name: $REG" "$f"; echo "::endgroup::"
          done
          echo "overlays=$OVERLAYS" >> "$GITHUB_OUTPUT"

      - name: Commit y push
        run: |
          set -e
          cd gitops
          git config user.name "ci-ingenia365erp"
          git config user.email "ci@ingenia365.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Los overlays ya tenian estos digests; nada que desplegar."
            exit 0
          fi
          SHORT="${GITHUB_SHA::12}"
          git commit -q -F - <<EOF
          deploy(${{ steps.fijar.outputs.overlays }}): $GITHUB_REF_NAME $SHORT

          Imagenes publicadas por $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          api      $API_DIGEST
          web      $WEB_DIGEST
          migrator $MIGRATOR_DIGEST
          EOF
          # Otro run pudo empujar entre el checkout y ahora: se rebasa y se reintenta.
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { echo "::error::Conflicto al rebasar sobre main del GitOps; resolver a mano."; exit 1; }
          done
          echo "::error::No se pudo empujar al repo GitOps tras tres intentos."
          exit 1
